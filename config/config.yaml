app:
  environment: "development"

vector_db:
  provider: "pinecone"
  index_name: "langchain-test-index"

retriever:
  top_k: 3
  score_threshold: 0.5

embedding_model:
  provider: "google"
  model_name: "models/text-embedding-004"

llm:
  active_provider: "google"

  google:
    provider: "google"
    model_name: "gemini-1.5-pro"

  groq:
    provider: "groq"
    model_name: "deepseek-r1-distill-llama-70b"

tools:
  tavily:
    max_results: 5